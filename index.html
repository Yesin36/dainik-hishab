<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<title>আমার দোকান - হিসাব খাতা</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
:root{
 --ink:#1f2a3c;--muted:#7a8497;--line:#eceef5;
 --navy:#2c3e50;--coral:#ff7a6b;--pink:#ee0979;--orange:#ff6a00;
 --purple:#6d4aff;--blue:#2f80ed;--green:#00a878;--teal:#0aa5c0;--amber:#f2a100;--red:#e5384f;
 --sh-sm:0 1px 2px rgba(31,42,60,.06),0 4px 12px -2px rgba(31,42,60,.08);
 --sh-md:0 2px 4px rgba(31,42,60,.05),0 12px 28px -8px rgba(31,42,60,.16);
 --sh-lg:0 4px 8px rgba(31,42,60,.06),0 24px 48px -12px rgba(31,42,60,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eef1f8;background-image:radial-gradient(circle at 10% 0%,#e9e2ff 0,transparent 40%),radial-gradient(circle at 100% 30%,#ffe6df 0,transparent 38%);background-attachment:fixed;color:var(--ink);font-family:'Hind Siliguri',sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}
button:active{transform:scale(.97)}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:96px}
header{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 18px;background:linear-gradient(135deg,#2c3e50 0%,#6a2f8f 45%,#ee0979 78%,#ff6a00 100%);color:#fff;border-radius:0 0 32px 32px;box-shadow:0 18px 36px -12px rgba(238,9,121,.45),0 6px 14px rgba(44,62,80,.2)}
.top{display:flex;align-items:center;justify-content:space-between}
